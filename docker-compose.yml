version: '3.8'

services:
  api:
    build: .
    container_name: eve-healthcare-api
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=eve_healthcare
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=eve-healthcare-docker-secret-key
      - JWT_EXPIRES_IN=24h
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: eve-healthcare-db
    environment:
      - POSTGRES_DB=eve_healthcare
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
